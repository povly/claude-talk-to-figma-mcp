version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group all @types/* updates into one PR
      types:
        patterns:
          - "@types/*"
      # Group all figma-related packages
      figma:
        patterns:
          - "@figma/*"
      # Group MCP SDK + Zod (often released together)
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"
    ignore:
      # Major versions require manual review; Dependabot opens them individually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
