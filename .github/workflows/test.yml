name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    name: Build & Test
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: "1.2"
        
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install dependencies
      run: bun install
      
    - name: Build project
      run: bun run build
      
    - name: Run server tests (Jest)
      run: bun run test

    - name: Run plugin tests (Vitest)
      run: bun run test:plugin

    - name: plugin typecheck (warn)
      run: bun run typecheck:plugin
      continue-on-error: true   # S1a: warn-only until error-count=0 (Task 14 promotes to block)